[project]
name = "canteiro-products"
version = "0.1.0"
description = "Produtos e preços da construção para o Plumo: as bases oficiais de custos (SINAPI...) com busca, item e composição analítica."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "fastapi>=0.128,<1",
    "uvicorn[standard]>=0.39,<1",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
importar-base = "canteiro_products.interfaces.cli.importar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canteiro_products"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["canteiro_products"]
